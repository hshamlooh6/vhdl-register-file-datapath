name: VHDL simulation

on:
  push:
  pull_request:

jobs:
  testbenches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GHDL
        run: sudo apt-get update && sudo apt-get install -y ghdl
      - name: Run self-checking testbenches
        run: bash scripts/run_tests.sh
